# Netlify builds the site from this repo on every push to main. The two VITE_ values are public by design (set in Netlify's
# environment variables, not committed); the Supabase service key must never be set here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed asset files never change, so browsers can keep them for a year. The page itself is always re-checked.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=()"
