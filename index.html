<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Exe — turn scattered thoughts into clear priorities." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Exe" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <title>Exe — Mission Status</title>
  <script>
    /* theme: light by default; ?theme=light or ?theme=dark switches and remembers the choice */
    (function () {
      var t = 'light';
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark') localStorage.setItem('exe-theme', q);
        t = localStorage.getItem('exe-theme') || 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name=theme-color]');
      if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#07090e');
    })();
  </script>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="exe-ui.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <button class="brand" data-nav="focus" aria-label="Exe home"><span class="brand-symbol" aria-hidden="true"><i></i><i></i></span><span>Exe</span></button>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="sidebar-menu">
        <button class="nav-link active" data-nav="focus"><span data-icon="target"></span><span>Focus</span></button>
        <button class="nav-link" data-nav="inbox"><span data-icon="inbox"></span><span>Inbox</span><span class="nav-count" data-inbox-count hidden></span></button>
        <button class="nav-link" data-nav="review"><span data-icon="sparkles"></span><span>AI Review</span><span class="nav-count" data-dock-count hidden></span></button>
        <button class="nav-link" data-nav="map"><span data-icon="network"></span><span>Project Map</span></button>
        <button class="nav-link" data-nav="decisions"><span data-icon="git-branch"></span><span>Decisions</span></button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-link sidebar-search" id="search-button" aria-label="Search workspace"><span data-icon="search"></span><span>Search</span></button>
        <button class="nav-link sidebar-search" data-open-workspace aria-label="Settings and backup"><span data-icon="settings"></span><span>Settings</span></button>
        <div class="sidebar-quiet"><span data-icon="shield-check"></span><span>Focus is protected.<small>Capture freely. Decide deliberately.</small></span></div>
        <button class="workspace-switch"><span class="avatar">A</span><span><strong>Altr Workspace</strong></span><span data-icon="chevron-down"></span></button>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <header class="desktop-topbar">
        <div class="breadcrumb">Workspace <span>/</span> Altr <span>/</span> <b id="crumb">Focus</b></div>
        <div class="top-actions">
          <span class="saved-indicator" id="saved-indicator"><span data-icon="cloud"></span> Saved on this device</span>
          <button class="top-capture" data-capture><span data-icon="plus"></span> Quick capture <kbd>⌘ K</kbd></button>
          <span class="desktop-avatar">A</span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div class="mobile-navigation">
  <nav class="mobile-dock" aria-label="Mobile primary navigation">
    <button class="dock-item active" data-nav="focus" aria-label="Focus"><span data-icon="crosshair"></span><small>Focus</small></button>
    <button class="dock-item" data-nav="inbox" aria-label="Inbox"><span data-icon="inbox"></span><small>Inbox</small><span class="dock-bubble" data-inbox-count hidden></span></button>
    <button class="dock-item" data-nav="review" aria-label="AI Review"><span data-icon="sparkles"></span><small>AI Review</small><span class="dock-bubble" data-dock-count hidden></span></button>
    <button class="dock-item" data-nav="map" aria-label="Map"><span data-icon="network"></span><small>Map</small></button>
    <button class="dock-item" data-nav="decisions" aria-label="Decisions"><span data-icon="git-branch"></span><small>Decisions</small></button>
    <button class="mobile-capture" data-capture aria-label="Capture a thought"><span data-icon="plus"></span></button>
  </nav>
  </div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
