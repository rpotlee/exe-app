name: Verify Exe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: git diff --check
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npx vite --host 127.0.0.1 --port 5173 > /tmp/exe-vite.log 2>&1 &
      - run: python tests/critical_flows.py
