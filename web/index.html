<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Exe — turn scattered thoughts into clear priorities." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Exe" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <title>Exe</title>
  <script>
    /* Follow the system appearance (the UI kit supplies both); ?theme=light|dark overrides. */
    (function () {
      var q = /[?&]theme=(light|dark)/.exec(location.search), mq = window.matchMedia('(prefers-color-scheme: dark)');
      var set = function () { document.documentElement.setAttribute('data-theme', q ? q[1] : mq.matches ? 'dark' : 'light'); };
      set(); if (!q) mq.addEventListener('change', set);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
