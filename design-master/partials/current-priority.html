<section class="priority-card" data-component="current-priority" aria-labelledby="priority-title">
  <div class="priority-heading">
    <span class="priority-tile" aria-hidden="true">$building_icon</span>
    <div class="priority-copy"><p class="overline">CURRENT PRIORITY</p><h2 id="priority-title">Confirm New York<br>business registration</h2><p class="workstream">Business foundation</p></div>
    <div class="progress-ring" data-component="progress-ring" role="img" aria-label="$progress percent complete, 0 of 3 steps">
      <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="35"/></svg><span><strong>$progress%</strong><small>0 of 3</small></span>
    </div>
  </div>
  <div class="priority-checklist">$priority_steps</div>
  <button type="button" class="focus-button" data-component="focus-cta">$focus_icon<span>Enter Focus Mode</span><span class="desktop-arrow">$chevron_icon</span></button>
</section>
